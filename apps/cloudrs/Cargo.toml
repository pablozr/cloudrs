[package]
name = "cloudrs"
description = "Native SoundCloud client for the desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
cloudrs-ui = { path = "../../crates/cloudrs-ui" }
gpui.workspace = true
gpui_platform.workspace = true
sc-core = { path = "../../crates/sc-core", default-features = false }
dirs = "6"
# The system language, for the first run (ADR 0025); already in the lock through cosmic-text.
sys-locale = "0.3"
sc-platform = { path = "../../crates/sc-platform" }
# Same version and codecs GPUI already compiles; decodes artwork to find its colour.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# The local hour, for Home's greeting (ADR 0013); already in the lock.
time = { version = "0.3", features = ["local-offset"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
# The main window's HWND for the media controls (ADR 0019); the same version GPUI uses.
raw-window-handle = "0.6"

[build-dependencies]
embed-resource = "3.0.12"

[features]
default = ["jam"]
# Listening together (ADR 0011): about 8 MB of peer-to-peer networking.
jam = ["sc-core/jam"]

# Installers (`cargo packager --release`): NSIS on Windows, .deb and AppImage
# on Linux, .dmg on macOS. Built in CI on a version tag.
[package.metadata.packager]
product-name = "cloudrs"
identifier = "dev.cloudrs.cloudrs"
description = "Native SoundCloud client for the desktop"
homepage = "https://github.com/pablozr/cloudrs"
authors = ["cloudrs contributors"]
publisher = "cloudrs contributors"
copyright = "Copyright (c) cloudrs contributors"
license-file = "../../LICENSE"
category = "Music"
icons = [
    "../../assets/brand/app-icon-256.png",
    "../../assets/brand/app-icon-512.png",
    "../../assets/brand/app-icon.ico",
]
before-packaging-command = "cargo build --release --locked -p cloudrs"
out-dir = "../../target/packages"
binaries = [{ path = "cloudrs", main = true }]

[package.metadata.packager.nsis]
# Per user: no administrator rights needed.
installMode = "currentUser"
# English, and Brazilian Portuguese when the system language is Portuguese (ADR 0025).
languages = ["English", "PortugueseBR"]
# Brand images (assets/installer/make-images.ps1 draws them).
sidebarImage = "../../assets/installer/sidebar.bmp"
headerImage = "../../assets/installer/header.bmp"
installerIcon = "../../assets/brand/app-icon.ico"

[package.metadata.packager.deb]
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0", "libasound2", "libxkbcommon-x11-0", "libvulkan1"]
