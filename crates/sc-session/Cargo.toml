[package]
name = "sc-session"
description = "cloudrs Jam: peer-to-peer listening sessions over iroh (ADR 0011)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
flume = "0.11"
# No metrics, no Apple fast datapath; aws-lc like reqwest's rustls (ADR 0011 §1).
iroh = { version = "1.3", default-features = false, features = ["tls-aws-lc-rs", "portmapper"], optional = true }
iroh-tickets = { version = "1.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "sync"] }
tracing = "0.1"

[features]
default = ["jam"]
# The peer-to-peer transport. Without it a session ends at once as
# unreachable, and none of iroh's crates are built (ADR 0011 §1).
jam = ["dep:iroh", "dep:iroh-tickets"]

[[example]]
name = "jam"
required-features = ["jam"]
