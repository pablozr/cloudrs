[package]
name = "sc-platform"
description = "cloudrs OS integration: keychain, sign-in window, Discord and media controls"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Discord Rich Presence over its local IPC (ADR 0015).
discord-rich-presence = "1"
flume = "0.11"
keyring = "4"
# OS media controls: SMTC, MPRIS, Now Playing (ADR 0019). Pinned to master for current windows/zbus; zbus, so Linux needs no libdbus.
souvlaki = { git = "https://github.com/Sinono3/souvlaki", rev = "93ff3d16700348f32fe174e985c828eff0587e3b", default-features = false, features = ["use_zbus"] }
tao = "0.37"
tracing = "0.1"
wry = "0.57"
