name: Release

# Builds the installers when a version tag is pushed (v0.1.0-beta.1...), or by
# hand from the Actions tab. The files are attached to the run as artifacts;
# publishing a GitHub Release with them is a separate, manual step.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
          - os: ubuntu-22.04
            formats: deb,appimage
          - os: macos-latest
            formats: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig-dev libzstd-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libfuse2
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Build the installers
        working-directory: apps/cloudrs
        run: cargo packager --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: cloudrs-${{ matrix.os }}
          path: |
            target/packages/*.exe
            target/packages/*.deb
            target/packages/*.AppImage
            target/packages/*.dmg
          if-no-files-found: error
      # Code signing (ADR 0016): off until the SignPath Foundation accepts the
      # project and the SIGNPATH_* variables and secret are set on the repository.
      - name: Upload the installer to sign
        id: unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: cloudrs-windows-unsigned
          path: target/packages/*.exe
          if-no-files-found: error
      - name: Sign the installer with SignPath
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Each request waits for a manual approval on SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/signed
      - name: Upload the signed installer
        if: steps.unsigned.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cloudrs-windows-signed
          path: target/signed/*.exe
          if-no-files-found: error
